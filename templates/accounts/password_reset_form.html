{% extends "base.html" %}
{% block title %}Reset password · Artipay{% endblock %}
{% block main_class %}auth-wrap{% endblock %}
{% block content %}<section class="auth-card"><h1>Reset your password</h1><p class="muted">Enter your account email and we’ll send reset instructions.</p><form method="post" class="form-stack">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{{ field.errors }}</label>{% endfor %}<button class="button button-primary button-full">Send reset link</button></form></section>{% endblock %}
